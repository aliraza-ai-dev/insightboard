name: insightboard
description: AI-Powered Business Dashboard App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.0
  # State Management
  provider: ^6.1.2
  # Charts
  fl_chart: ^0.69.0
  # File Handling
  file_picker: ^8.1.6
  csv: ^6.0.0
  excel: ^4.0.6
  # PDF
  pdf: ^3.11.1
  printing: ^5.13.3
  # HTTP & APIs
  http: ^1.2.2
  # UI Components
  google_fonts: ^6.2.1
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  # Local Storage
  shared_preferences: ^2.3.4
  # Notifications
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
